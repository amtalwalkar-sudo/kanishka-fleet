<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanishka Fleet Manager</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 40px;
    }
    h2 { color: #38bdf8; margin-top: 0; font-size: 1.3rem; }
    .card { 
      background: #1e293b; 
      padding: 16px; 
      border-radius: 12px; 
      margin-bottom: 16px; 
      border: 1px solid #334155; 
    }
    label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #94a3b8; font-weight: 600; margin-top: 10px; }
    input, select { 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: #fff; 
      font-size: 1rem; 
      outline: none;
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    .btn { 
      width: 100%; 
      padding: 14px; 
      border-radius: 8px; 
      border: none; 
      background: #0284c7; 
      color: white; 
      font-weight: bold; 
      font-size: 1rem; 
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:active { background: #0369a1; }
    .btn-danger { background: #ef4444; margin-top: 15px; padding: 10px; font-size: 0.85rem; }
    .log-item { 
      background: #0f172a; 
      padding: 12px; 
      border-radius: 8px; 
      margin-top: 10px; 
      border-left: 4px solid #38bdf8; 
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .stat-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .stat-val { font-size: 1.05rem; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 0.72rem; color: #94a3b8; }
    .exp-tag { display: inline-block; background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 4px; margin-top: 4px;}
  </style>
</head>
<body>

  <h2>Kanishka Fleet Manager</h2>

  <!-- Input Form -->
  <div class="card">
    <label>Vehicle Number</label>
    <input type="text" id="vehicle" placeholder="e.g. MH-02-DN-4821">

    <label>Driver Name</label>
    <input type="text" id="driver" placeholder="e.g. Ramesh">

    <label>Odometer Reading (KM)</label>
    <input type="number" id="reading" placeholder="e.g. 15420">

    <label>Daily Revenue (₹)</label>
    <input type="number" id="revenue" placeholder="e.g. 2500">

    <hr style="border: 0.5px solid #334155; margin-top: 15px;">
    <strong style="color: #f87171; font-size: 0.9rem;">Fuel & Expense Breakdown</strong>

    <label>Fuel Amount (₹)</label>
    <input type="number" id="fuelCost" placeholder="e.g. 800">

    <label>Fuel Added (Kg / Liters)</label>
    <input type="number" id="fuelQty" placeholder="e.g. 10">

    <label>Maintenance / Repairs (₹)</label>
    <input type="number" id="maintCost" placeholder="e.g. 200">

    <label>Daily Fixed (EMI / Ins. Share ₹)</label>
    <input type="number" id="fixedCost" placeholder="e.g. 500">

    <button class="btn" onclick="addEntry()">Save Complete Log</button>
  </div>

  <!-- Summary Cards -->
  <div class="card">
    <strong style="color: #38bdf8;">Overall Financial Summary</strong>
    <div class="summary-grid">
      <div class="stat-box">
        <div class="stat-lbl">Total Revenue</div>
        <div class="stat-val" id="totRev" style="color:#4ade80;">₹0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Total Expenses</div>
        <div class="stat-val" id="totExp" style="color:#f87171;">₹0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Total Fuel Spent</div>
        <div class="stat-val" id="totFuel">₹0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Net Profit</div>
        <div class="stat-val" id="netProfit" style="color:#38bdf8;">₹0</div>
      </div>
    </div>
  </div>

  <!-- Activity Logs -->
  <div class="card">
    <strong style="color: #38bdf8;">Saved Logs & Expense Details</strong>
    <div id="logs" style="margin-top: 10px;">No logs saved yet.</div>
    <button class="btn btn-danger" onclick="clearLogs()">Clear All Data</button>
  </div>

  <script>
    function render() {
      const data = JSON.parse(localStorage.getItem('kanishka_fleet_v3') || '[]');
      const container = document.getElementById('logs');
      
      let revSum = 0;
      let expSum = 0;
      let fuelSum = 0;

      if (data.length === 0) {
        container.innerHTML = '<span style="color:#64748b">No logs saved yet.</span>';
        document.getElementById('totRev').innerText = '₹0';
        document.getElementById('totExp').innerText = '₹0';
        document.getElementById('totFuel').innerText = '₹0';
        document.getElementById('netProfit').innerText = '₹0';
        return;
      }

      container.innerHTML = data.map(item => {
        const itemFuel = Number(item.fuelCost || 0);
        const itemMaint = Number(item.maintCost || 0);
        const itemFixed = Number(item.fixedCost || 0);
        const itemRev = Number(item.revenue || 0);
        const totalItemExp = itemFuel + itemMaint + itemFixed;

        revSum += itemRev;
        expSum += totalItemExp;
        fuelSum += itemFuel;

        return `
          <div class="log-item">
            <strong>${item.vehicle}</strong> (${item.driver})<br>
            Odometer: <strong>${item.km} KM</strong><br>
            Revenue: <span style="color:#4ade80">₹${itemRev}</span> | Total Exp: <span style="color:#f87171">₹${totalItemExp}</span><br>
            <div>
              ${itemFuel > 0 ? `<span class="exp-tag">Fuel: ₹${itemFuel} (${item.fuelQty || 0} unit)</span>` : ''}
              ${itemMaint > 0 ? `<span class="exp-tag">Maint: ₹${itemMaint}</span>` : ''}
              ${itemFixed > 0 ? `<span class="exp-tag">Fixed/EMI: ₹${itemFixed}</span>` : ''}
            </div>
            <small style="color:#64748b; display:block; margin-top:4px;">${item.time}</small>
          </div>
        `;
      }).join('');

      document.getElementById('totRev').innerText = '₹' + revSum;
      document.getElementById('totExp').innerText = '₹' + expSum;
      document.getElementById('totFuel').innerText = '₹' + fuelSum;
      
      const net = revSum - expSum;
      const netEl = document.getElementById('netProfit');
      netEl.innerText = '₹' + net;
      netEl.style.color = net >= 0 ? '#4ade80' : '#f87171';
    }

    function addEntry() {
      const vehicle = document.getElementById('vehicle').value.trim();
      const driver = document.getElementById('driver').value.trim() || 'Unassigned';
      const km = document.getElementById('reading').value.trim();
      const revenue = document.getElementById('revenue').value.trim() || '0';
      const fuelCost = document.getElementById('fuelCost').value.trim() || '0';
      const fuelQty = document.getElementById('fuelQty').value.trim() || '0';
      const maintCost = document.getElementById('maintCost').value.trim() || '0';
      const fixedCost = document.getElementById('fixedCost').value.trim() || '0';

      if (!vehicle || !km) {
        alert('Please fill out Vehicle Number and Odometer Reading.');
        return;
      }

      const data = JSON.parse(localStorage.getItem('kanishka_fleet_v3') || '[]');
      data.unshift({
        vehicle: vehicle,
        driver: driver,
        km: km,
        revenue: revenue,
        fuelCost: fuelCost,
        fuelQty: fuelQty,
        maintCost: maintCost,
        fixedCost: fixedCost,
        time: new Date().toLocaleString()
      });

      localStorage.setItem('kanishka_fleet_v3', JSON.stringify(data));

      document.getElementById('vehicle').value = '';
      document.getElementById('driver').value = '';
      document.getElementById('reading').value = '';
      document.getElementById('revenue').value = '';
      document.getElementById('fuelCost').value = '';
      document.getElementById('fuelQty').value = '';
      document.getElementById('maintCost').value = '';
      document.getElementById('fixedCost').value = '';
      
      render();
    }

    function clearLogs() {
      if (confirm('Are you sure you want to delete all saved logs?')) {
        localStorage.removeItem('kanishka_fleet_v3');
        render();
      }
    }

    render();
  </script>
</body>
      </html>

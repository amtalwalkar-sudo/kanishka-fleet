<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kanishka Fleet Manager</title>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      margin: 0; 
      padding: 16px; 
      padding-bottom: 40px;
    }
    h2 { color: #38bdf8; margin-top: 0; font-size: 1.3rem; }
    .card { 
      background: #1e293b; 
      padding: 16px; 
      border-radius: 12px; 
      margin-bottom: 16px; 
      border: 1px solid #334155; 
    }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; font-weight: 600; }
    input, select { 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: #fff; 
      font-size: 1rem; 
      margin-bottom: 12px; 
      outline: none;
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    .btn { 
      width: 100%; 
      padding: 14px; 
      border-radius: 8px; 
      border: none; 
      background: #0284c7; 
      color: white; 
      font-weight: bold; 
      font-size: 1rem; 
      cursor: pointer;
    }
    .btn:active { background: #0369a1; }
    .btn-danger { background: #ef4444; margin-top: 10px; padding: 8px; font-size: 0.85rem; }
    .log-item { 
      background: #0f172a; 
      padding: 12px; 
      border-radius: 8px; 
      margin-top: 10px; 
      border-left: 4px solid #38bdf8; 
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>

  <h2>Kanishka Fleet Manager</h2>

  <!-- Input Form -->
  <div class="card">
    <label>Vehicle Number</label>
    <input type="text" id="vehicle" placeholder="e.g. MH-01-AB-1234">

    <label>Driver Name</label>
    <input type="text" id="driver" placeholder="e.g. Ramesh">

    <label>Odometer Reading (KM)</label>
    <input type="number" id="reading" placeholder="e.g. 15420">

    <label>Daily Revenue (₹)</label>
    <input type="number" id="revenue" placeholder="e.g. 2500">

    <label>Expenses / Fuel (₹)</label>
    <input type="number" id="expense" placeholder="e.g. 800">

    <button class="btn" onclick="addEntry()">Save Trip / Daily Log</button>
  </div>

  <!-- Summary Cards -->
  <div class="card">
    <label>Overall Totals</label>
    <div class="summary-grid">
      <div class="stat-box">
        <div class="stat-lbl">Total Revenue</div>
        <div class="stat-val" id="totRev">₹0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Total Expenses</div>
        <div class="stat-val" id="totExp" style="color:#f87171;">₹0</div>
      </div>
    </div>
  </div>

  <!-- Activity Logs -->
  <div class="card">
    <label>Saved Logs</label>
    <div id="logs">No logs saved yet.</div>
    <button class="btn btn-danger" onclick="clearLogs()">Clear All Data</button>
  </div>

  <script>
    function render() {
      const data = JSON.parse(localStorage.getItem('kanishka_fleet_v2') || '[]');
      const container = document.getElementById('logs');
      
      let revSum = 0;
      let expSum = 0;

      if (data.length === 0) {
        container.innerHTML = '<span style="color:#64748b">No logs saved yet.</span>';
        document.getElementById('totRev').innerText = '₹0';
        document.getElementById('totExp').innerText = '₹0';
        return;
      }

      container.innerHTML = data.map(item => {
        revSum += Number(item.revenue || 0);
        expSum += Number(item.expense || 0);
        return `
          <div class="log-item">
            <strong>${item.vehicle}</strong> (${item.driver})<br>
            Odometer: <strong>${item.km} KM</strong><br>
            Revenue: <span style="color:#4ade80">₹${item.revenue}</span> | Fuel/Exp: <span style="color:#f87171">₹${item.expense}</span><br>
            <small style="color:#64748b">${item.time}</small>
          </div>
        `;
      }).join('');

      document.getElementById('totRev').innerText = '₹' + revSum;
      document.getElementById('totExp').innerText = '₹' + expSum;
    }

    function addEntry() {
      const vehicle = document.getElementById('vehicle').value.trim();
      const driver = document.getElementById('driver').value.trim() || 'Unassigned';
      const km = document.getElementById('reading').value.trim();
      const revenue = document.getElementById('revenue').value.trim() || '0';
      const expense = document.getElementById('expense').value.trim() || '0';

      if (!vehicle || !km) {
        alert('Please fill out Vehicle Number and Odometer Reading.');
        return;
      }

      const data = JSON.parse(localStorage.getItem('kanishka_fleet_v2') || '[]');
      data.unshift({
        vehicle: vehicle,
        driver: driver,
        km: km,
        revenue: revenue,
        expense: expense,
        time: new Date().toLocaleString()
      });

      localStorage.setItem('kanishka_fleet_v2', JSON.stringify(data));

      document.getElementById('vehicle').value = '';
      document.getElementById('driver').value = '';
      document.getElementById('reading').value = '';
      document.getElementById('revenue').value = '';
      document.getElementById('expense').value = '';
      
      render();
    }

    function clearLogs() {
      if (confirm('Are you sure you want to delete all saved logs?')) {
        localStorage.removeItem('kanishka_fleet_v2');
        render();
      }
    }

    render();
  </script>
</body>
</html>

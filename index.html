<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanishka Fleet</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      margin: 0; 
      padding: 16px; 
    }
    h2 { color: #38bdf8; margin-top: 0; }
    .card { 
      background: #1e293b; 
      padding: 16px; 
      border-radius: 10px; 
      margin-bottom: 16px; 
      border: 1px solid #334155; 
    }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #94a3b8; }
    input { 
      width: 100%; 
      padding: 12px; 
      border-radius: 6px; 
      border: 1px solid #475569; 
      background: #0f172a; 
      color: #fff; 
      font-size: 16px; 
      margin-bottom: 12px; 
      -webkit-appearance: none;
    }
    button { 
      width: 100%; 
      padding: 14px; 
      border-radius: 6px; 
      border: none; 
      background: #0284c7; 
      color: white; 
      font-weight: bold; 
      font-size: 16px; 
    }
    .log-item { 
      background: #0f172a; 
      padding: 10px; 
      border-radius: 6px; 
      margin-top: 8px; 
      border-left: 4px solid #38bdf8; 
    }
  </style>
</head>
<body>

  <h2>Kanishka Fleet Tracker</h2>

  <div class="card">
    <label>Driver / Vehicle Number</label>
    <input type="text" id="vehicle" placeholder="e.g. MH-01-AB-1234">

    <label>Odometer Reading (KM)</label>
    <input type="number" id="reading" placeholder="e.g. 15420">

    <button onclick="addEntry()">Save Entry</button>
  </div>

  <div class="card">
    <label>Saved Logs</label>
    <div id="logs">No logs saved yet.</div>
  </div>

  <script>
    function render() {
      const data = JSON.parse(localStorage.getItem('fleet_data') || '[]');
      const container = document.getElementById('logs');
      if (data.length === 0) {
        container.innerHTML = '<span style="color:#64748b">No logs saved yet.</span>';
        return;
      }
      container.innerHTML = data.map(item => `
        <div class="log-item">
          <strong>${item.vehicle}</strong> — ${item.km} km
          <br><small style="color:#64748b">${item.time}</small>
        </div>
      `).join('');
    }

    function addEntry() {
      const vehicle = document.getElementById('vehicle').value;
      const km = document.getElementById('reading').value;

      if (!vehicle || !km) {
        alert('Please fill out both fields');
        return;
      }

      const data = JSON.parse(localStorage.getItem('fleet_data') || '[]');
      data.unshift({ vehicle: vehicle, km: km, time: new Date().toLocaleString() });
      localStorage.setItem('fleet_data', JSON.stringify(data));

      document.getElementById('vehicle').value = '';
      document.getElementById('reading').value = '';
      render();
    }

    render();
  </script>
</body>
</html>
